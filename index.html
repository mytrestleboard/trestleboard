.tlogo{flex:none;overflow:visible;color:#d3a94f}
:root:not([data-theme="dark"]) .tlogo{color:#9a7418}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tlogo{color:#d3a94f}}
.tlogo .etch{fill:#4a2a0c;stroke:none;transition:fill 1.4s ease,filter 1.4s ease}
.tlogo.lit .etch{fill:#ffcf6b;filter:drop-shadow(0 0 1.5px #ffcc66) drop-shadow(0 0 4px rgba(255,170,60,.9))}
.tlogo.cool .etch{fill:currentColor;filter:drop-shadow(0 0 3px rgba(211,169,79,.45))}
.tlogo .flame{fill:#ffb347;stroke:none;filter:drop-shadow(0 0 1.5px #ffe7a0) drop-shadow(0 0 4px #ff6a00)}
.tlogo .spk{fill:#ffd27a}
.tlogo .smk{fill:#9aa3b5}
.tlogo.still .etch{fill:currentColor;filter:none}
@keyframes tlFlare{0%{r:1.6}40%{r:3.4}100%{r:1.6}}
header.bar .brand{align-items:center;gap:14px}
.brand .tlogo{width:52px;height:52px;cursor:pointer}
.brand .bt{display:flex;flex-direction:column;gap:2px;justify-content:center}.brand .bt h1{margin:0;line-height:1.15}.brand .bt span{line-height:1.2}
@media (max-width:600px){.brand .tlogo{width:44px;height:44px}}
h2.title::before{content:"";display:inline-block;width:.85em;height:.85em;margin-right:.4em;vertical-align:-.08em;background:currentColor;color:var(--gold);-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat}
.empty::before,.panel.empty::before{content:"";display:block;width:38px;height:38px;margin:0 auto 8px;background:var(--gold);opacity:.55;-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat}
body::after{content:"";position:fixed;right:28px;bottom:28px;width:min(340px,58vw);height:min(340px,58vw);background:var(--gold);opacity:.06;pointer-events:none;z-index:0;-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat}
.brand .slogan{letter-spacing:.06em}
.panel.welcome{border-color:var(--gold)}
.hero{position:relative;overflow:hidden;border-radius:14px;margin:6px auto 18px;max-width:760px;min-height:260px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#1b2a4a 0%,#0b1120 80%);color:#d3a94f;border:1px solid var(--line)}
.hero-img{position:absolute;inset:0;background:var(--hero-img,none) center/cover no-repeat;opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,17,32,.25),rgba(11,17,32,.7))}
.hero-in{position:relative;z-index:1;display:grid;justify-items:center;gap:10px;padding:28px 16px;text-align:center}
.hero-in .tlogo{width:120px;height:120px}
.hero-in b{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,5vw,32px);letter-spacing:.04em}
.hero-in small{letter-spacing:.16em;text-transform:uppercase;font-size:12px;opacity:.9}
.tl-foot{display:flex;gap:10px;align-items:center;justify-content:center;padding:28px 16px 40px;color:var(--muted);font-size:13px}
.tl-foot i{display:inline-block;width:22px;height:22px;background:var(--gold);-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat}
#tl-splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:radial-gradient(ellipse at center,#1b2a4a 0%,#0b1120 75%);color:#d3a94f;transition:opacity .8s ease,visibility .8s}
#tl-splash.out{opacity:0;visibility:hidden}
#tl-splash[hidden]{display:none}
#tl-splash .in{display:grid;justify-items:center;gap:16px;text-align:center;padding:16px}
#tl-splash .tlogo{width:min(46vw,200px);height:min(46vw,200px);color:#d3a94f}
#tl-splash b{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,5vw,30px);letter-spacing:.04em}
#tl-splash small{opacity:.9;letter-spacing:.16em;text-transform:uppercase;font-size:clamp(12px,3vw,15px)}
#tl-splash::before{content:"";position:absolute;inset:0;background:var(--splash-img,none) center/cover no-repeat;opacity:.38}
#tl-splash .in{position:relative}
@media (prefers-reduced-motion:reduce){#tl-splash{display:none}}

header.bar{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.hdr-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
header .wrap{flex-wrap:nowrap;gap:12px 16px}
header .brand{flex:0 1 auto;min-width:0}
.hdr-right{flex:1 1 auto;justify-content:flex-end;flex-wrap:nowrap}
.hdr-right .viewas{flex:0 1 auto;flex-wrap:nowrap}
.hdr-right .viewas select{min-width:0;max-width:100%;text-overflow:ellipsis}
.acct{flex:none}
@media (max-width:820px){.hdr-right .viewas label{display:none}.brand .bt span{display:none}.brand .tlogo{width:40px;height:40px}header.bar .brand{gap:10px}.brand h1{font-size:19px}.hdr-right{gap:10px}}
.acct{position:relative}
.acct-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer}
.acct-btn:hover{border-color:var(--accent)}
.acct-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:14px;z-index:30;display:grid;gap:10px}
.acct-pop .row{display:flex;gap:12px;align-items:center}
.acct-pop .mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;cursor:pointer}
.acct-pop .mi:hover{background:var(--sunk)}
.acct-pop hr{border:0;border-top:1px solid var(--line);margin:0}
.pics{display:grid;gap:4px;border-radius:10px;overflow:hidden}.pics.n1{grid-template-columns:1fr}.pics.n2,.pics.n4{grid-template-columns:1fr 1fr}.pics.n3{grid-template-columns:1fr 1fr}.pics.n3 button:first-child{grid-column:1/3}
.pics button{padding:0;border:0;background:var(--line);cursor:zoom-in;display:block;min-height:0}.pics img{display:block;width:100%;height:100%;max-height:420px;object-fit:cover}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumb{position:relative}.thumb img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}.thumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#333;color:#fff;font-size:13px;line-height:1;cursor:pointer}
.fchip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-decoration:none;color:inherit}
.pollbar{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:transparent;color:inherit;cursor:pointer;overflow:hidden;margin:0 0 6px}.pollbar i{position:absolute;inset:0 auto 0 0;background:rgba(120,140,200,.25)}.pollbar span{position:relative;display:flex;justify-content:space-between;gap:10px}.pollbar.me{border-width:2px}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}.lbx img{max-width:96vw;max-height:92vh}
.avatar.photo{background-size:cover;background-position:center;color:transparent}
.avatar.big{width:64px;height:64px;font-size:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg label{cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:5px 12px;font-size:13px;color:var(--muted);white-space:nowrap;border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--accent);color:var(--accent-fg)}
.seg label:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:600px){.seg span{padding:5px 8px;font-size:12px}}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;border:0;padding:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(16px)}
.sw input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acct-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:end;margin-bottom:12px}
.acct-row label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
@media (max-width:600px){.acct-name{display:none}.acct-btn{padding-right:3px}}
.viewas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.viewas label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select,input,button,textarea{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=time],input[type=email],input[type=tel],textarea{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.out .viewas,body.out nav.tabs,body.out .demo-note{display:none}
.login{max-width:380px;margin:8vh auto 0;padding:28px 26px;text-align:center}
.login h2{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 4px}
.login .sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.login .fake{display:block;text-align:left;margin:0 0 12px}
.login .fake span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.login .fake div{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:9px 10px;color:var(--muted);font-size:14px;user-select:none;cursor:default}

/* Memory Drill Engine styles. Everything is scoped under .md-drill.
   Re-theme by overriding these variables on .md-drill (or a parent). Default is the dark look. */
.md-drill {
  --md-bg: #121722; --md-card: #1a2130; --md-ink: #e7eaf1; --md-muted: #9aa3b5; --md-line: #2d3649;
  --md-accent: #9db4ec; --md-gold: #d6b066; --md-reveal: #26324c;
  --md-head-font: "Cormorant Garamond", Georgia, serif; --md-body-font: "Literata", Georgia, serif;
  display: block; max-width: 760px; margin: 0 auto; padding: 28px 16px 60px;
  background: var(--md-bg); color: var(--md-ink); font-family: var(--md-body-font); color-scheme: dark;
}
.md-drill [hidden] { display: none !important; }
.md-drill header h1 { font-family: var(--md-head-font); font-size: 2.3rem; line-height: 1.05; margin: 0; color: var(--md-accent); text-wrap: balance; }
.md-drill header p { margin: .4rem 0 0; color: var(--md-muted); font-size: .95rem; }
.md-levels { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 10px; }
.md-levels button { font: inherit; font-size: .9rem; border: 1px solid var(--md-line); background: var(--md-card); color: var(--md-ink); padding: 8px 12px; border-radius: 999px; cursor: pointer; }
.md-levels button b { color: var(--md-gold); }
.md-levels button[aria-pressed="true"] { background: var(--md-accent); border-color: var(--md-accent); color: var(--md-bg); }
.md-levels button[aria-pressed="true"] b { color: var(--md-bg); }
.md-drill button:focus-visible { outline: 2px solid var(--md-gold); outline-offset: 2px; }
.md-hint { color: var(--md-muted); font-size: .88rem; min-height: 1.3em; margin: 0 0 14px; }
.md-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.md-tools button { font: inherit; font-size: .85rem; background: none; border: 1px solid var(--md-line); color: var(--md-accent); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.md-tools select { font: inherit; font-size: .85rem; background: var(--md-card); color: var(--md-ink); border: 1px solid var(--md-line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
.md-sheet { background: var(--md-card); border: 1px solid var(--md-line); border-radius: 10px; padding: 26px 24px; }
.md-sheet h2 { font-family: var(--md-head-font); letter-spacing: .14em; text-transform: uppercase; font-size: 1.05rem; color: var(--md-gold); margin: 0 0 14px; text-align: center; }
.md-sheet p { font-size: 1.12rem; line-height: 1.95; margin: 0 0 1.1em; max-width: 65ch; white-space: pre-line; }
.md-sheet p:last-child { margin-bottom: 0; }
.md-w { cursor: pointer; border-radius: 3px; padding: 0 1px; }
.md-w:hover, .md-w.open { background: var(--md-reveal); }
.md-x { color: var(--md-gold); letter-spacing: .06em; }
.md-lbl { display: block; font-family: var(--md-head-font); font-size: .95rem; letter-spacing: .1em; text-transform: uppercase; color: var(--md-gold); margin-bottom: 2px; }
.md-num { font-size: .7rem; color: var(--md-muted); margin-right: 6px; vertical-align: .25em; }
.md-foot { margin-top: 18px; color: var(--md-muted); font-size: .8rem; }
@media (max-width: 600px) {
  .md-drill { padding: 14px 12px 40px; }
  .md-drill header h1 { font-size: 1.6rem; }
  .md-drill header p { font-size: .85rem; }
  .md-levels { margin: 14px 0 8px; gap: 6px; }
  .md-levels button { padding: 6px 10px; font-size: .82rem; }
  .md-sheet { padding: 16px 14px; }
  .md-sheet p { font-size: 1rem; line-height: 1.85; }
}

/* ---- Welcome intro ("Masonic Learning, Made Fun") ---- */
#drillintro{--gold:#d6b066;--ink:#e7eaf1;--muted:#9aa3b5;--accent:#9db4ec;position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at center,#1d2740 0%,#0d111a 75%);cursor:pointer;transition:transform .9s cubic-bezier(.7,0,.3,1),opacity .9s}
#drillintro.up{transform:translateY(-100%);opacity:.6}
#drillintro svg{width:120px;height:120px;margin-bottom:18px}
#drillintro .ln{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:ddraw 1.1s ease-out forwards}
#drillintro .ln2{animation-delay:.35s}
#drillintro .gl{fill:var(--gold);opacity:0;animation:ddfade .5s ease-out 1.2s forwards}
#drillintro .wl{font-family:"Cormorant Garamond",Georgia,serif;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-size:1rem;opacity:0;animation:drise .7s ease-out .9s forwards}
#drillintro .hd{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;color:var(--ink);font-size:clamp(2rem,7vw,3.6rem);line-height:1.05;margin:.3em 0;opacity:0;animation:drise .8s ease-out 1.3s forwards}
#drillintro .hd em{font-style:normal;color:var(--accent)}
#drillintro .sb{color:var(--muted);font-size:.95rem;opacity:0;animation:drise .7s ease-out 1.8s forwards}
#drillintro .tap{position:absolute;bottom:22px;color:var(--muted);font-size:.75rem;letter-spacing:.1em;opacity:0;animation:ddfade .6s ease-out 2.4s forwards}
@keyframes ddraw{to{stroke-dashoffset:0}}
@keyframes dfade{to{opacity:1}}
@keyframes drise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#drillintro *{animation-duration:.01s!important;animation-delay:0s!important}#drillintro{transition:opacity .4s}#drillintro.up{transform:none;opacity:0}}

const MD = (function(){
// Memory Drill Engine
// Renders one memorization drill (from a drill JSON spec) into any container element.
// No dependencies, no build step. Works as an ES module in any framework (React, Vue,
// Svelte, plain HTML). Styles live in drill-engine.css, scoped under .md-drill.
//
//   import { renderDrill } from './drill-engine.js';
//   const spec = await fetch('drills/ea-charge.json').then(r => r.json());
//   const drill = renderDrill(document.getElementById('box'), spec, { disclaimer: '...' });
//   drill.destroy();   // when the host page unmounts it
//
// Spec shape (see drills/*.json):
//   { slug, title, heading, source, sheet, paras: [ "text" | ["Label", "text"], ... ],
//     disclaimer?: string, hidden?: boolean }

const LEVELS = [
  { name: 'Full text', hint: 'Read it through a few times. Say it out loud.' },
  { name: 'Level 1', hint: '3rd and 4th letters hidden. Say each word, then tap to check if unsure.' },
  { name: 'Level 2', hint: 'About half the letters hidden at random. Hit New shuffle for a fresh set.' },
  { name: 'Level 3', hint: 'First and last letter only.' },
  { name: 'Level 4', hint: 'First letter plus a blank for each missing letter, so you can see word length.' },
  { name: 'Level 5', hint: 'First letters only. This is the one to carry into lodge.' },
  { name: 'Level 6', hint: 'Paragraph openers only. Recite the rest from memory, then check with Full.' }
];

const BLANK = '<span class="md-x">_</span>';

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Small seeded random generator so Level 2 is stable until "New shuffle" is pressed.
function rng(seed) {
  let s = seed >>> 0;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// Masks one word for a level. Exported so a host app can reuse it (e.g. flash cards).
function maskWord(w, level, r) {
  if (level === 0) return esc(w);
  const first = w[0], rest = w.slice(1);
  if (level === 1) return [...w].map((c, i) => (i === 2 || i === 3) ? BLANK : esc(c)).join('');
  if (level === 2) return esc(first) + [...rest].map(c => (r() < 0.5 ? BLANK : esc(c))).join('');
  if (level === 3) return w.length <= 2 ? esc(w) : esc(first) + BLANK.repeat(w.length - 2) + esc(w[w.length - 1]);
  if (level === 4) return esc(first) + BLANK.repeat(rest.length);
  if (level === 5) return esc(first);
  return '';
}

function readSaved(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
}

    '<div class="md-levels" role="group" aria-label="Difficulty level"></div>' +
    '<p class="md-hint"></p>' +
    '<div class="md-tools"><select class="md-para" aria-label="Which paragraph"><option value="all">All of it</option></select>' +
    '<button type="button" class="md-shuffle">New shuffle</button>' +
    '<button type="button" class="md-close">Hide peeked words</button></div>' +
    '<article class="md-sheet"></article>' +
    '<footer class="md-foot">' + esc(spec.disclaimer || opts.disclaimer || '') + '</footer>';

  const $ = sel => el.querySelector(sel);
  const levelsBox = $('.md-levels'), sheet = $('.md-sheet'), hint = $('.md-hint'), sel = $('.md-para'), shuffle = $('.md-shuffle');

  LEVELS.forEach((L, i) => {

  text.forEach((t, i) => {

      } else {
        for (const t of tokens) {
          if (!/^[A-Za-z]/.test(t)) { body += esc(t); continue; }
          const id = pi + '-' + (wi++);

  sel.addEventListener('change', () => { focus = sel.value; render(); });
  shuffle.addEventListener('click', () => { seed = (seed * 7 + 13) % 100000; open.clear(); render(); });

    destroy() { el.innerHTML = ''; el.classList.remove('md-drill'); },
    setLevel,
    getLevel: () => level
  };

// ---- Catalog helpers (degree gating) ----------------------------------------------
// manifest.json lists every drill with its group. Degree access rules:
//   EA sees EA only. FC sees EA + FC. MM sees everything.
// Hidden drills never appear in a list; they open only by direct slug.

function drillsForDegree(manifest, degree) {
  const allowed = manifest.access[String(degree).toUpperCase()] || [];
  return manifest.drills.filter(d => !d.hidden && allowed.includes(d.group));
}

function canOpen(manifest, degree, slug) {
  const d = manifest.drills.find(x => x.slug === slug);
  if (!d) return false;
  if (d.hidden) return true; // hidden = link-only, shared on purpose
  return (manifest.access[String(degree).toUpperCase()] || []).includes(d.group);
}

return {renderDrill,drillsForDegree,canOpen};

function calendar(ctx){
  const y=S.calY,mo=S.calM,keys=ctx.keys,multi=keys.length>1&&!ctx.all;
  const evs=monthEvents(y,mo).filter(e=>ctx.all||keys.some(k=>evIn(e,k)));
  const colorOf=e=>PAL[Math.max(0,keys.findIndex(k=>evIn(e,k)))%PAL.length];
  const first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate(),prevDays=new Date(y,mo,0).getDate();
  let cells="";
  for(let i=0;i<42;i++){
    const dn=i-first+1; let cy=y,cm=mo,cd=dn,out=false;
    if(dn<1){cm=mo-1;cd=prevDays+dn;out=true;if(cm<0){cm=11;cy--}}
    else if(dn>days){cm=mo+1;cd=dn-days;out=true;if(cm>11){cm=0;cy++}}
    if(i>=35&&dn>days&&i%7===0) break;
    const key=ymd(cy,cm,cd); const de=out?[]:evs.filter(e=>e.date===key);
    cells+=`<button type="button" class="day ${out?"out":""} ${key===TODAY?"today":""}" data-day="${key}" aria-pressed="${S.calDay===key}" aria-label="${key}, ${de.length} events"><span class="dnum">${cd}</span>
      ${de.slice(0,3).map(e=>{const c=colorOf(e);return `<span class="pill ${typeClass(e.type)} ${multi?"multi":""}" ${multi?`style="--bc:${c};border-left-color:${c}"`:""}>${esc(evPill(e))}</span>`}).join("")}${de.length>3?`<span class="more">+${de.length-3} more</span>`:""}</button>`;
  }
  const shown=S.calDay?evs.filter(e=>e.date===S.calDay):evs;
  const lg=ctx.lodge,sk=ctx.scope||(lg?keyOf(lg.n):null);
  const canAdd=signedIn()&&(sk?(sk[0]==="l"||sk==="gl"?canEdit(lg||byNum(sk==="gl"?0:+sk.slice(2))):canManageScope(sk)):manageableScopes().length>0);
  const addKey=sk||"cal";
  return `<div class="calbar"><div class="calnav"><button class="btn ghost small" type="button" data-act="prev" aria-label="Previous month">‹</button><h2>${MONTHS[mo]} ${y}</h2><button class="btn ghost small" type="button" data-act="next" aria-label="Next month">›</button>
      <button class="btn ghost small" type="button" data-act="today">Today</button></div>
      <div class="actions" style="margin:0">${lg?`<button class="btn ghost small" type="button" data-act="cal-from-lodge" data-n="${lg.n}">Open in my calendar</button>`:""}${canAdd&&UI.adding!==addKey?`<button class="btn small" type="button" data-act="add-ev" data-add="${esc(addKey)}">Add event</button>`:""}</div></div>
    ${UI.adding===addKey?eventForm(sk):""}
    <div class="month">${DOWS.map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
    <p class="hint" style="margin:10px 0 0">Stated meetings fill in automatically from each lodge's meeting time.${signedIn()?"":" Members-only events are hidden until you sign in."}</p>
    <div style="margin-top:16px"><div class="actions" style="justify-content:space-between;margin:0 0 4px"><h3 class="sub" style="margin:0">${S.calDay?prettyDate(S.calDay):"This month"}</h3>${S.calDay?`<button class="linkbtn" type="button" data-act="allmonth">Show the whole month</button>`:""}</div>
    ${shown.length?`<ul class="agenda">${shown.map(agendaItem).join("")}</ul>`:`<p class="hint">${S.calDay?"Nothing scheduled that day.":lg?(lg.gl?"Nothing on the Grand Lodge calendar this month. Grand Lodge admins can add the Grand Master's visits and statewide events.":lg.meet?"Nothing scheduled this month.":"No meeting time set, so stated meetings can't be added to the calendar yet."):!keys.length&&!ctx.all?"Your calendar is empty. Follow a lodge or add a body above.":"Nothing scheduled this month."}</p>`}</div>`;
}

    img.onerror=()=>{URL.revokeObjectURL(url);toast("That file isn't an image I can read")};img.src=url;return}
  if(t.id==="cal-add"){if(t.value){const cur=[...calKeys()];if(!cur.includes(t.value))cur.push(t.value);S.calBodies=cur;S.calDay=null}render();return}

let SBS=null;try{SBS=JSON.parse(localStorage.getItem("tlh-sb"))}catch(e){}
const sbSave=()=>{try{SBS?localStorage.setItem("tlh-sb",JSON.stringify(SBS)):localStorage.removeItem("tlh-sb")}catch(e){}};
const sbSess=(j,nm)=>({access:j.access_token,refresh:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:j.user.id,email:j.user.email,name:nm||(j.user.user_metadata||{}).name||""});
async function sbRefresh(){if(!SBS||!SBS.refresh)return;try{const r=await fetch(SB.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SBS.refresh})});const j=await r.json();if(j.access_token){SBS=sbSess(j,SBS.name);sbSave()}else{SBS=null;sbSave()}}catch(e){}}
async function sbFetch(path,opt){opt=opt||{};const h=Object.assign({apikey:SB.key,"Content-Type":"application/json"},opt.headers||{});
  if(opt.auth!==false&&SBS){if(SBS.exp<Date.now()/1000+60)await sbRefresh();if(SBS)h.Authorization="Bearer "+SBS.access}
  const r=await fetch(SB.url+path,{method:opt.method||"GET",headers:h,body:opt.body!==undefined?JSON.stringify(opt.body):undefined});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const er=new Error((j&&(j.msg||j.message||j.error_description||j.error))||r.statusText||"Request failed");er.status=r.status;throw er}
  return j}
const CL_MAP=["profiles","edits","bodyInfo","web"],CL_ARR=["posts","events"],CL_ONE=["manual","manualB","positions","bylaws","groups","authority","mentor","rsvps","apps","audit"];
const CL={snap:{},last:"1970-01-01T00:00:00+00:00",busy:false,t:null,poll:null,on:false,role:"member"};
function clItems(){const out={},one=CL_ONE.concat(CL.role==="super"?["roles"]:[]);
  CL_MAP.forEach(c=>{out[c]={};const o=S[c]||{};Object.keys(o).forEach(id=>{if(c==="profiles"&&o[id]&&o[id].sample)return;out[c][id]=JSON.stringify(o[id])})});
  CL_ARR.forEach(c=>{out[c]={};(S[c]||[]).forEach(x=>{if(x&&x.id!=null&&!x.sample)out[c][String(x.id)]=JSON.stringify(x)})});
  one.forEach(c=>{if(S[c]!==undefined)out[c]={_:JSON.stringify(S[c])}});
  return out}
function clSched(){if(!CL.on)return;clearTimeout(CL.t);CL.t=setTimeout(cloudPush,1200)}
async function cloudPush(){if(!CL.on||!SBS||CL.busy)return;CL.busy=true;
  try{const cur=clItems(),rows=[];
    for(const c in cur){const prev=CL.snap[c]||{};for(const id in cur[c])if(prev[id]!==cur[c][id])rows.push({coll:c,id,data:JSON.parse(cur[c][id]),deleted:false});for(const id in prev)if(!(id in cur[c]))rows.push({coll:c,id,data:{},deleted:true})}
    for(let i=0;i<rows.length;i+=100)await sbFetch("/rest/v1/docs?on_conflict=coll,id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:rows.slice(i,i+100)});
    CL.snap=cur;CL.err=""}catch(e){CL.err=e.message;console.warn("cloud push failed:",e.message)}
  CL.busy=false}
async function cloudPull(first){let changed=false,more=true;
  while(more){const rows=await sbFetch("/rest/v1/docs?select=coll,id,data,deleted,updated_at&updated_at=gt."+encodeURIComponent(CL.last)+"&order=updated_at.asc&limit=1000");
    more=rows.length>=1000;const all=clItems();
    rows.forEach(r=>{CL.last=r.updated_at>CL.last?r.updated_at:CL.last;const c=r.coll,id=String(r.id);if(!CL.snap[c])CL.snap[c]={};
      const cur=all[c]||{};if(!first&&cur[id]!==undefined&&cur[id]!==CL.snap[c][id])return;
      if(CL_MAP.includes(c)){S[c]=S[c]||{};if(r.deleted){delete S[c][id];delete CL.snap[c][id]}else{S[c][id]=r.data;CL.snap[c][id]=JSON.stringify(r.data)}}
      else if(CL_ARR.includes(c)){S[c]=S[c]||[];const i=S[c].findIndex(x=>String(x.id)===id);if(r.deleted){if(i>=0)S[c].splice(i,1);delete CL.snap[c][id]}else{if(i>=0)S[c][i]=r.data;else S[c].push(r.data);CL.snap[c][id]=JSON.stringify(r.data)}}
      else if(CL_ONE.includes(c)||c==="roles"){S[c]=r.data;CL.snap[c]={_:JSON.stringify(r.data)}}
      else return;
      changed=true})}
  if(changed){save();const a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/^(radio|checkbox|button|file)$/.test(a.type||"");if(!typing&&!first)render()}
  return changed}
async function cloudStart(){
  USERS.splice(0,USERS.length,...USERS.filter(u=>u.id==="public"));
  await cloudPull(true);
  let a=(await sbFetch("/rest/v1/accounts?select=*&user_id=eq."+SBS.uid))[0];
  if(!a){const pid="u"+SBS.uid.replace(/-/g,"").slice(0,12);
    if(!S.profiles[pid])S.profiles[pid]={name:SBS.name||SBS.email.split("@")[0],degree:"EA",lodges:[],current:[],past:[],certs:[],bodies:[],contact:{email:C(SBS.email,"lodge"),phone:C("","private"),city:C("","members")}};
    a=(await sbFetch("/rest/v1/accounts",{method:"POST",headers:{Prefer:"return=representation"},body:{user_id:SBS.uid,profile_id:pid,role:"member"}}))[0]}
  CL.role=a.role||"member";const p=S.profiles[a.profile_id];
  USERS.push({id:a.profile_id,role:CL.role,profile:a.profile_id,label:(p&&p.name)||SBS.email,district:a.district||undefined,lodge:a.lodge||undefined});
  S.user=a.profile_id;S.tab="feed";if(S.profiles[a.profile_id])S.prof=a.profile_id;CL.on=true;
  CL.snap=Object.assign({},CL.snap);save();render();clearInterval(CL.poll);CL.poll=setInterval(()=>{if(!document.hidden)cloudPull(false).catch(()=>{})},15000);clSched()}
function clMsg(t){const m=document.getElementById("cl-msg");if(m)m.textContent=t}
async function cloudSignIn(){const em=(document.getElementById("cl-email").value||"").trim(),pw=document.getElementById("cl-pw").value;if(!em||!pw){clMsg("Enter your email and password.");return}
  clMsg("Signing in...");try{const j=await sbFetch("/auth/v1/token?grant_type=password",{method:"POST",auth:false,body:{email:em,password:pw}});SBS=sbSess(j);sbSave();await cloudStart()}catch(e){clMsg(e.message==="Invalid login credentials"?"That email and password don't match. If you just created the account, confirm your email first.":e.message)}}
async function cloudSignUp(){const em=(document.getElementById("cl-email").value||"").trim(),pw=document.getElementById("cl-pw").value,nm=(document.getElementById("cl-name").value||"").trim();if(!em||!pw||!nm){clMsg("Enter your name, email and a password to create an account.");return}
  if(pw.length<8){clMsg("Use a password of at least 8 characters.");return}
  clMsg("Creating account...");try{const j=await sbFetch("/auth/v1/signup",{method:"POST",auth:false,body:{email:em,password:pw,data:{name:nm}}});if(j&&j.access_token){SBS=sbSess(j,nm);sbSave();await cloudStart()}else clMsg("Account created. Check your email for a confirmation link, then come back here and sign in.")}catch(e){clMsg(e.message)}}
function cloudSignOut(){SBS=null;sbSave();CL.on=false;CL.snap={};CL.last="1970-01-01T00:00:00+00:00";clearInterval(CL.poll)}
if(CLOUD){document.body.classList.add("cloud");USERS.splice(0,USERS.length,...USERS.filter(u=>u.id==="public"));S.user="public"}
{const q=new URLSearchParams(location.search),ef=q.get("embed"),es=q.get("scope");if(ef&&es&&(ef==="posts"||ef==="cal")){renderEmbed(ef,es)}else{render();tlSplash();if(CLOUD&&SBS)cloudStart().catch(e=>{console.warn("cloud start failed",e.message);if(e.status===401){SBS=null;sbSave()}})}}
